# SPDX-License-Identifier: MIT-0
# Builds Scion recovery on GitHub's runners: the static aarch64 tools (hfsfuse
# and apfs-fuse in Alpine containers, apfsprogs with zig), then build.sh on
# TeamWin's stock image and verify.sh. The image, its Odin tar and SHA256SUMS
# are the run's artifact. Nothing here talks to a phone.
name: build
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Host tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends shellcheck mksh busybox dash
      - name: shellcheck
        run: |
          # What goes into the image: every finding. Build and test scripts: warnings and errors.
          shellcheck -s sh overlay/sbin/scion overlay/sbin/scion-bootlogs
          shellcheck -S warning -s sh tests/test-actions.sh tests/test-fastbootd.sh
          shellcheck -S warning build.sh verify.sh scripts/build-apfsprogs.sh scripts/build-fastbootd.sh
      - name: Write policy and fstab (tests/test-policy.py)
        run: python3 -I tests/test-policy.py
      - name: scion's actions against fake partitions, in TWRP's mksh, busybox sh and dash
        run: |
          for sh in mksh "busybox sh" dash; do tests/test-actions.sh "$sh"; done
      - name: scion-fastbootd (built here with cc) with the real fastboot client, over TCP
        run: |
          sudo apt-get install -y -q --no-install-recommends fastboot android-sdk-libsparse-utils
          tests/test-fastbootd.sh

  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Host tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends librsvg2-bin python3-pil shellcheck cpio mksh file
          df -h . | tail -1

      - name: Tool binaries from cache
        id: tools-cache
        uses: actions/cache@v4
        with:
          path: tools-out
          key: tools-v1-${{ hashFiles('third_party/**', 'scripts/build-apfsprogs.sh') }}

      - name: hfsfuse, hfsdump (Alpine, static aarch64)
        if: steps.tools-cache.outputs.cache-hit != 'true'
        run: |
          set -eux
          W=$PWD/tools-out/hfsfuse; mkdir -p "$W"; cd "$RUNNER_TEMP"
          git clone -q --branch 0.469 https://github.com/0x09/hfsfuse hfsfuse-src
          test "$(git -C hfsfuse-src rev-parse HEAD)" = e2a84c602cbce6ea4a2fb0441fa1fe56c2c4e907
          echo '#define HFSFUSE_VERSION_STRING "0.469-e2a84c6"' > version.h
          git -C hfsfuse-src archive --prefix hfsfuse-0.469/src/ --add-file "$PWD/version.h" --prefix hfsfuse-0.469/ HEAD -o "$W/hfsfuse-0.469.tar.gz"
          sha256sum "$W/hfsfuse-0.469.tar.gz"
          cp "$GITHUB_WORKSPACE/third_party/hfsfuse/build-in-alpine.sh" "$W/"
          docker run --rm -v "$W:/w" alpine:3.20 sh /w/build-in-alpine.sh

      - name: apfs-fuse, apfs-extract, apfsutil (Alpine, static aarch64)
        if: steps.tools-cache.outputs.cache-hit != 'true'
        run: |
          set -eux
          W=$PWD/tools-out/apfs-fuse; mkdir -p "$W/src" "$W/scripts"
          git clone -q https://github.com/sgan81/apfs-fuse "$W/src/apfs-fuse"
          git -C "$W/src/apfs-fuse" checkout -q 66b86bd525e8
          git -C "$W/src/apfs-fuse" submodule update -q --init
          git -C "$W/src/apfs-fuse" apply "$GITHUB_WORKSPACE/third_party/apfs-fuse/apfs-fuse-local.patch"
          cp -r "$GITHUB_WORKSPACE/third_party/apfs-fuse/apfs-extract" "$W/src/"
          cp "$GITHUB_WORKSPACE/third_party/apfs-fuse/build-in-alpine.sh" "$W/scripts/"
          docker run --rm -v "$W:/w" alpine:3.20 sh /w/scripts/build-in-alpine.sh
          sudo rm -rf "$W/src"

      - name: apfsprogs (zig, static aarch64)
        if: steps.tools-cache.outputs.cache-hit != 'true'
        run: |
          set -eux
          WORK=$RUNNER_TEMP/apfsprogs-work scripts/build-apfsprogs.sh "$PWD/tools-out/apfsprogs"

      - name: scion-fastbootd (zig, static aarch64)
        run: WORK=$RUNNER_TEMP/fastbootd-work scripts/build-fastbootd.sh "$PWD/fastbootd-out"

      - name: The aarch64 scion-fastbootd under qemu, with the real fastboot client
        run: |
          sudo apt-get install -y -q --no-install-recommends qemu-user-static fastboot android-sdk-libsparse-utils
          tests/test-fastbootd.sh "$PWD/fastbootd-out/scion-fastbootd"

      - name: Build the image
        run: |
          HFS_BIN=tools-out/hfsfuse/bin/aarch64 APFS_BIN=tools-out/apfs-fuse/bin/aarch64 \
            APFSPROGS_BIN=tools-out/apfsprogs FASTBOOTD_BIN=fastbootd-out ./build.sh

      - name: Verify (no phone)
        run: ./verify.sh

      - name: Previews of the theme (scripts/preview.py, an approximation, not TWRP)
        run: |
          mkdir -p preview
          for p in main2 scion_install scion_switch scion_backup scion_disks scion_settings scion_logs scion_fastboot; do
            python3 scripts/preview.py work/merged-twres "$p" "preview/$p.png"
          done
          python3 scripts/preview.py work/merged-twres scion_confirm preview/scion_confirm.png \
            "tw_action_text1=Install iOS root" "tw_text1=root-full.img" \
            "tw_text2=ERASES USERDATA: Android's data or the iOS on it" \
            "tw_text3=Every 64 MiB piece is read back and compared" "tw_slider_text=Swipe to erase and write USERDATA"

      - name: Upload previews
        uses: actions/upload-artifact@v4
        with:
          name: scion-recovery-preview
          path: preview/*.png

      - name: Artifact
        uses: actions/upload-artifact@v4
        with:
          name: scion-recovery
          path: |
            out/scion-recovery.img
            out/scion-recovery.tar
            out/SHA256SUMS
          if-no-files-found: error
