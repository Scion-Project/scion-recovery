# Scion recovery's write policy: the ONE list every Scion tool reads before it
# writes a partition (/sbin/scion, scion-fastbootd) and that the build checks
# TWRP's own fstab against (scripts/fstab.py). Installed as /etc/scion-partitions.conf.
#
#   write NAME...   Scion's tools may write these, and nothing else.
#   never NAME...   never written by anything Scion ships, whatever else says
#                   so: a "never" name wins over a "write" name, a by-name link
#                   that resolves to a "never" partition's device is refused,
#                   and TWRP's fstab may not list them (so TWRP's own Restore
#                   and Install Image cannot write them either).
#
# Names are the S9's GPT partition names (the kernel's PARTNAME). Reading is
# never restricted: EFS can be copied to a file, read only.

# BOOT holds what starts (Android's kernel, HakiOS' or iOS 27's loader);
# USERDATA holds Android's data, or HakiOS' /private/var, or iOS 27's root.
write BOOT USERDATA

# Phone identity, modem and its data.
never EFS SEC_EFS CPEFS RADIO CP_DEBUG NAD_REFER
# Boot loader and its settings (Download mode lives here), and the secure world.
never BOTA0 BOTA1 SBOOT CM PARAM UP_PARAM KEYSTORAGE TIMA RPMB
# Samsung's persistent data and FRP.
never STEADY PERSISTENT DQMDBG
